name: Deploy prototype to GitHub Pages

on:
  push:
    branches: [main, prototype/run-1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: prototype/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: prototype/pnpm-lock.yaml
      - name: Add the WASM target
        run: rustup target add wasm32-unknown-unknown
      - name: Install
        working-directory: prototype
        run: pnpm install --frozen-lockfile
      - name: Build (Rust sim to WASM, then the app)
        working-directory: prototype
        run: pnpm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: prototype/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
