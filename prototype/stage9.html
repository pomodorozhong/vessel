<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vessel prototype: Stage 9 look</title>
  <style>
    html, body { margin: 0; height: 100%; background: #101014; color: #ddd; font: 13px/1.35 ui-monospace, Consolas, monospace; overflow: hidden; }
    #game { display: block; width: 100vw; height: 100vh; object-fit: contain; }
    #overlay { position: fixed; left: 8px; top: 8px; padding: 6px 8px; background: rgba(0,0,0,.65); white-space: pre; pointer-events: none; }
    #unsupported { display: none; position: fixed; inset: 0; background: #101014; padding: 10vh 10vw; font: 16px/1.5 system-ui, sans-serif; }
    #unsupported h1 { font-size: 24px; }
  </style>
</head>
<body>
  <canvas id="game" width="1920" height="1080" tabindex="0"></canvas>
  <div id="overlay">starting…</div>
  <div id="switches" style="display:none"></div>
  <div id="unsupported">
    <h1>Your browser does not support WebGPU</h1>
    <p>Vessel needs WebGPU and has no fallback. <span id="unsupported-reason"></span></p>
  </div>
  <script type="module" src="/src/stage9/main9.ts"></script>
</body>
</html>
